spring.application.name=nature-earth

# ── Base de datos (local) ──────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/natureearth
spring.datasource.username=postgres
spring.datasource.password=
# The SQL schema is the source of truth and must never be mutated by the app.
# 'validate' would fail on the pgvector/geography types; 'none' is the correct choice here.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ─────────────────────────────────────────────────
# Development-only default. In production inject APP_JWT_SECRET from the environment.
app.jwt.secret=${APP_JWT_SECRET:4uFcNtBHvP8a2pxLNkBQVLo9PiTIHq5u2LzJV255F0Padl+HS8mVo4Ih/qlH/eK5yvpyaCpLm50H3DmyNX7n/A==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ── CORS ────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ── Swagger / OpenAPI ──────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ───────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ── Puerto ─────────────────────────────────────────────
server.port=8080
